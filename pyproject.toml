[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legged_mjlab"
version = "0.0.1"
description = "Go2 environment and assets for mjlab-based legged robotics experiments."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mjlab==1.6.0",
  "mujoco~=3.11.0",
  "mujoco-warp~=3.11.0",
  "warp-lang>=1.14.0",
  "torch==2.7.1",
  "scipy>=1.15",
  "tensorboard>=2.20.0",
]

[project.optional-dependencies]
# Select exactly one accelerator profile when syncing the project.  The
# requirements are intentionally repeated here so uv can attach each profile
# to its explicit PyTorch index while the published base metadata remains
# standards-compliant.
cu128 = ["torch==2.7.1"]
cpu = ["torch==2.7.1"]

[tool.uv]
# The upstream mjlab wheel and mujoco-warp are currently resolved for the
# supported deployment target.  Keep this explicit so lock generation does
# not silently claim unsupported ARM64 or non-Linux binaries.
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [
  [{ extra = "cu128" }, { extra = "cpu" }],
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torch = [
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.setuptools.packages.find]
where = ["."]
include = ["legged_mjlab*", "resources*"]
namespaces = true

[tool.setuptools.package-data]
# ``resources`` is deliberately included as a namespace package.  This keeps
# the existing repository layout while making XML/MJCF and mesh files part of
# the wheel instead of relying on the caller's working directory.
resources = [
  "robots/unitree_go2/xmls/*.xml",
  "robots/unitree_go2/xmls/assets/*.obj",
]
